name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | sdkmanager --licenses || true

      - name: Run JVM Unit Tests
        id: unit_tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test_output.log

      - name: Annotate Failure
        if: failure()
        run: |
          ERR_MSG=$(grep -E "(FAILURE:|Caused by:|What went wrong:|A problem occurred)" -A 5 test_output.log | head -n 20 | tr '\n' ' ' | sed 's/"//g')
          echo "::error title=Root Cause::$ERR_MSG"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
